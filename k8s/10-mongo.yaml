# MongoDB: a StatefulSet with a persistent volume so data survives pod
# restarts and redeploys. Only reachable inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: flatshare
  labels:
    app: mongo
spec:
  clusterIP: None   # headless: stable DNS name for the StatefulSet pod
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: flatshare
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      # Run as the mongodb user (uid/gid 999), never root. fsGroup makes the
      # data volume writable for that group.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: mongo
          image: ${DOCKERHUB_USERNAME}/flatshare-mongo:${IMAGE_TAG}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: flatshare-secrets, key: MONGO_ROOT_USERNAME } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: flatshare-secrets, key: MONGO_ROOT_PASSWORD } }
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: flatshare-secrets, key: MONGO_APP_USER } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: flatshare-secrets, key: MONGO_APP_PASSWORD } }
            - name: MONGO_APP_DB
              valueFrom: { configMapKeyRef: { name: flatshare-config, key: MONGO_APP_DB } }
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          # Up to 5 minutes for mongod to start accepting connections.
          # Liveness/readiness only begin after this succeeds.
          startupProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 10
            failureThreshold: 30
          # Ready = mongod is up AND ensure-users.sh has created the users
          # (it writes this file). A file check is far cheaper than mongosh.
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/users-ready"]
            periodSeconds: 5
            failureThreshold: 3
          # Cheap check: is mongod still accepting connections?
          livenessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
