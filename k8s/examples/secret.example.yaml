# Reference only: NOT applied by the pipeline and never filled with real
# values. The deploy workflow creates the real "flatshare-secrets" Secret
# from GitHub Actions secrets. To create it by hand on the server instead:
#
#   kubectl -n flatshare create secret generic flatshare-secrets \
#     --from-literal=MONGO_ROOT_USERNAME=root \
#     --from-literal=MONGO_ROOT_PASSWORD=... \
#     --from-literal=MONGO_APP_USER=flatshare \
#     --from-literal=MONGO_APP_PASSWORD=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=BREVO_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: flatshare-secrets
  namespace: flatshare
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: root
  MONGO_ROOT_PASSWORD: change_me
  MONGO_APP_USER: flatshare
  MONGO_APP_PASSWORD: change_me
  JWT_SECRET: change_me
  BREVO_API_KEY: ""
