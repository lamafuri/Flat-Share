# Non-secret configuration. ${...} placeholders are filled in by the
# deploy workflow from GitHub repository variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flatshare-config
  namespace: flatshare
data:
  PORT: "5000"
  NODE_ENV: "${NODE_ENV}"
  COOKIE_SECURE: "false"
  CLIENT_URL: "${APP_URL}"
  JWT_EXPIRES_IN: "7d"
  EMAIL_FROM: "${EMAIL_FROM}"
  EMAIL_FROM_NAME: "${EMAIL_FROM_NAME}"
  MONGO_APP_DB: "flatshare"
